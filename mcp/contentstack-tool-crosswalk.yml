specification: API Commons ToolCrosswalk
specificationVersion: '0.1'
provider: Contentstack
providerId: contentstack
generated: '2026-09-17'
method: derived
source: mcp/contentstack-mcp-tools-*.json (fetched verbatim from https://mcp.contentstack.com/<group>/tools) bound
  against openapi/*.yml in this repository
description: 'Binds each of the 206 Contentstack MCP tools to the REST operation it actually calls. Contentstack
  publishes the binding itself: every tool definition carries a mapper block with the exact apiUrl and HTTP method,
  so these rows are read from the provider''s own data rather than guessed from names. 60 tools bind to an operationId
  in this repository''s OpenAPI corpus; the remaining 146 call documented Contentstack endpoints this corpus does
  not yet describe.'
surfaces:
  openapi:
    path: openapi/
    specs: 33
    operations: 114
    gated: false
  graphql:
    endpoint: https://graphql.contentstack.com
    gated: true
    note: Introspection returns HTTP 403 Forbidden without a stack api_key and delivery token; the schema is per-stack
      and cannot be introspected anonymously.
  mcp:
    tool_catalogue: https://mcp.contentstack.com/<group>/tools
    gated: false
    transport: local stdio via npx -y @contentstack/mcp
    transport_gated: true
coverage:
  mcp_tools: 206
  bound: 60
  mcp_only: 146
  rest_operations: 114
  rest_covered: 47
  rest_only: 67
