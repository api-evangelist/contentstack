      url: https://www.contentstack.com/docs/developers/apis
- target: $
  description: 'Record the runtime semantics Contentstack publishes but does not express in the contract: per-organization
    rate limits with their response headers, and the absence of any idempotency mechanism.'
  update:
    x-rate-limits:
      scope: organization
      read: 10/second
      write: 10/second
      bulk: 1/second
      headers:
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      status: 429
      retry_after: false
      source: https://www.contentstack.com/docs/developers/apis/content-management-api
    x-idempotency:
      coverage: none
      note: Contentstack documents no Idempotency-Key header or replay window anywhere in its API reference; a retried
        write creates a second resource.
    x-artifacts:
      rate_limits: rate-limits/contentstack-rate-limits.yml
      conventions: conventions/contentstack-conventions.yml
      errors: errors/contentstack-problem-types.yml
      scopes: scopes/contentstack-scopes.yml
      lifecycle: lifecycle/contentstack-lifecycle.yml
