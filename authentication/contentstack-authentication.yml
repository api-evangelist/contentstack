oauth:
  documented: true
  docs: https://www.contentstack.com/docs/developer-hub/contentstack-oauth
  flow: authorization_code
  token_types:
  - app token (machine-to-machine)
  - user token (on behalf of a user)
  scopes: scopes/contentstack-scopes.yml
  scope_count: 95
  note: OAuth 2.0 is the delegated-access path used by Developer Hub apps and by the first-party MCP server. It
    is not visible in the securitySchemes of the specs in this repository, which declare the header-token schemes
    only — so the derived profile below understates the real auth surface.
token_kinds:
- name: Stack API key
  header: api_key
  purpose: Selects the stack. Required on every delivery and most management calls; not a secret on its own.
- name: Delivery token
  header: access_token
  purpose: Read-only access scoped to one environment of one stack.
- name: Management token
  header: 'authorization: Bearer <token>'
  purpose: Server-to-server write access to one stack, with no user session.
- name: Authtoken
  header: authtoken
  purpose: User session token from the login endpoint.
- name: OAuth access token
  header: 'authorization: Bearer <token>'
  purpose: Delegated access carrying explicit scopes; the only mechanism with least-privilege granularity.
note: Five distinct token kinds across the estate. Only the OAuth path carries scopes; a management token is all-or-nothing
  for the stack it is issued against.
