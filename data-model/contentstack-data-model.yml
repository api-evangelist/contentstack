specificationVersion: '0.1'
provider: Contentstack
providerId: contentstack
generated: '2026-09-17'
method: derived
source: $ref graph and id-reference fields across the 33 OpenAPI documents in openapi/, cross-checked against the
  object model described at https://www.contentstack.com/docs/developers/create-content-types/about-fields
description: 'The Contentstack entity graph as its own contracts declare it. Everything roots at the Stack: a Stack
  owns content types, entries, assets, global fields, environments, locales, branches and releases, and the delivery
  surface is a read projection of the same objects keyed by api_key (stack) plus access_token (environment).'
root_entity: Stack
identifier_convention:
  primary_key: uid
  note: Every first-class Contentstack object carries a uid. Contentstack does not use typed id prefixes — a uid
    is an opaque string, so a uid alone does not tell an agent what kind of object it addresses; the calling path
    does.
  tenant_keys:
  - api_key selects the stack
  - branch header selects the branch
  - environment + locale select the delivery projection
entity_count: 101
relationship_count: 56
