apis:
- aid: contentstack:graphql-content-delivery-api
  name: Contentstack GraphQL Content Delivery API
  tags:
  - Content Delivery
  - GraphQL
  - Headless CMS
  - Query Language
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://graphql.contentstack.com
  humanURL: https://www.contentstack.com/docs/developers/apis/graphql-content-delivery-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/graphql-content-delivery-api
    type: Documentation
  - url: graphql/contentstack-graphql.md
    type: GraphQL
  description: The Contentstack GraphQL Content Delivery API enables developers to query content from their Contentstack
    stack using GraphQL syntax, allowing precise retrieval of only the fields and relationships needed in a single
    request. It is built on top of the Content Delivery API and supports querying entries, assets, and nested references
    across content types. The GraphQL API does not support mutations or subscriptions; it is strictly read-only
    and intended for front-end and application data fetching.
- aid: contentstack:image-delivery-api
  name: Contentstack Image Delivery API
  tags:
  - Asset Delivery
  - Image
  - Media
  - Transformation
  tags_raw:
  - Asset Delivery
  - Images
  - Media
  - Transformation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://images.contentstack.io
  humanURL: https://www.contentstack.com/docs/developers/apis/image-delivery-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/image-delivery-api
    type: Documentation
  description: The Contentstack Image Delivery API allows developers to retrieve and transform images stored as
    assets in their Contentstack stacks. It supports on-the-fly image manipulation operations including resizing,
    cropping, format conversion, quality adjustment, and overlay compositing via URL query parameters. Images are
    served from a CDN for fast delivery, and transformations are applied at request time without creating additional
    stored copies.
