apis:
- aid: contentstack:graphql-content-delivery-api
  name: Contentstack GraphQL Content Delivery API
  tags:
  - Content Delivery
  - GraphQL
  - Headless CMS
  - Query Language
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://graphql.contentstack.com
  humanURL: https://www.contentstack.com/docs/developers/apis/graphql-content-delivery-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/graphql-content-delivery-api
    type: Documentation
  - url: graphql/contentstack-graphql.md
    type: GraphQL
  description: >-
    The Contentstack GraphQL Content Delivery API enables developers to query content from their Contentstack
    stack using GraphQL syntax, allowing precise retrieval of only the fields and relationships needed
    in a single request. It is built on top of the Content Delivery API and supports querying entries,
    assets, and nested references across content types. The GraphQL API does not support mutations or
    subscriptions; it is strictly read-only and intended for front-end and application data fetching.
- aid: contentstack:image-delivery-api
  name: Contentstack Image Delivery API
  tags:
  - Asset Delivery
  - Image
  - Media
  - Transformation
  tags_raw:
  - Asset Delivery
  - Images
  - Media
  - Transformation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://images.contentstack.io
  humanURL: https://www.contentstack.com/docs/developers/apis/image-delivery-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/image-delivery-api
    type: Documentation
  description: >-
    The Contentstack Image Delivery API allows developers to retrieve and transform images stored as assets
    in their Contentstack stacks. It supports on-the-fly image manipulation operations including resizing,
    cropping, format conversion, quality adjustment, and overlay compositing via URL query parameters.
    Images are served from a CDN for fast delivery, and transformations are applied at request time without
    creating additional stored copies.
- aid: contentstack:analytics-api
  name: Contentstack Analytics API
  tags:
  - Analytics
  - Metrics
  - Monitoring
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.contentstack.io
  humanURL: https://www.contentstack.com/docs/developers/apis/analytics-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/analytics-api
    type: Documentation
  - url: openapi/contentstack-analytics-api-openapi.yml
    type: OpenAPI
  description: >-
    The Contentstack Analytics API provides access to usage and performance metrics for CMS, Launch, and
    Automate products within a Contentstack organization. Developers can retrieve analytics data programmatically
    to build custom dashboards, monitor content delivery performance, and track platform usage against
    plan limits.
- aid: contentstack:knowledge-vault-api
  name: Contentstack Knowledge Vault API
  tags:
  - Artificial Intelligence
  - Knowledge-Management
  - RAG
  - Vector Database
  tags_raw:
  - AI
  - Knowledge Management
  - RAG
  - Vector Database
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://ai.contentstack.com
  humanURL: https://www.contentstack.com/docs/developers/apis/knowledge-vault-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/knowledge-vault-api
    type: Documentation
  - url: openapi/contentstack-knowledge-vault-api-openapi.yml
    type: OpenAPI
  description: >-
    The Contentstack Knowledge Vault API provides endpoints for ingesting, updating, and deleting content
    items stored in a Brand Kit's Knowledge Vault. The Knowledge Vault is a vector database that stores
    brand-specific knowledge content which is retrieved during AI content generation to provide accurate,
    brand-aligned responses. Content ingested via this API is vectorized and made available to the Generative
    AI API for retrieval augmented generation (RAG) workflows.
- aid: contentstack:generative-ai-api
  name: Contentstack Generative AI API
  tags:
  - Artificial Intelligence
  - Brand Kit
  - Content Generation
  - Generative AI
  tags_raw:
  - AI
  - Brand Kit
  - Content Generation
  - Generative AI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://ai.contentstack.com/brand-kits
  humanURL: https://www.contentstack.com/docs/developers/apis/generative-ai-api
  properties:
  - url: https://www.contentstack.com/docs/developers/apis/generative-ai-api
    type: Documentation
  - url: openapi/contentstack-generative-ai-api-openapi.yml
    type: OpenAPI
  description: >-
    The Contentstack Generative AI API provides an endpoint for generating AI-powered content using a
    Brand Kit's knowledge vault and voice profiles. It acts as a communication channel between the vector
    database and large language models, processing prompts with retrieval augmented generation (RAG) to
    produce brand-aligned content.
