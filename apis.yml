description: Contentstack is a composable, API-first content platform — an Agentic Experience Platform built around
  a headless CMS, a real-time customer data layer and an agent runtime. Developers reach it through a read-only
  Content Delivery API on a global CDN, a write-side Content Management API, a read-only GraphQL delivery surface,
  an on-the-fly Image Delivery API, and product APIs for Launch (front-end hosting), Automation Hub, Personalize,
  BrandKit AI and SCIM 2.0 user provisioning. Contentstack publishes a 95-scope OAuth 2.0 reference, an llms.txt,
  markdown twins of its API reference pages, and a first-party Model Context Protocol server exposing 206 tools
  whose definitions — including the REST call each one makes — it serves anonymously as JSON.
